<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#141210">
<title>Kinomori — Menu</title>
<meta name="description" content="Kinomori, Tamraght — Handmade Dumplings, Rice, Noodles & Pho, Drinks. Prices in MAD.">
<style>
  :root{ --bg:#141210; --fg:#f2ece4; --muted:#a89e90; --line:#2a2622; }
  *{ box-sizing:border-box; }
  html,body{ margin:0; padding:0; background:var(--bg); color:var(--fg);
    font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    -webkit-font-smoothing:antialiased; }
  header{ text-align:center; padding:26px 18px 10px; }
  header h1{ margin:0; font-size:19px; letter-spacing:.32em; font-weight:600; text-transform:uppercase; }
  header p{ margin:8px 0 0; font-size:12px; color:var(--muted); letter-spacing:.14em; text-transform:uppercase; }
  nav{ display:flex; gap:8px; justify-content:center; flex-wrap:wrap; padding:14px 12px 4px; }
  nav a{ color:var(--fg); text-decoration:none; font-size:12px; letter-spacing:.1em;
    text-transform:uppercase; border:1px solid var(--line); border-radius:999px; padding:7px 14px; }
  nav a:active{ background:#221e1a; }
  main{ padding:14px 0 30px; }
  figure{ margin:0 0 10px; }
  figure img{ display:block; width:100%; height:auto; background:#1c1916; }
  .hint{ text-align:center; font-size:11px; color:var(--muted); padding:16px 18px 4px; letter-spacing:.06em; }
  footer{ text-align:center; font-size:11px; color:var(--muted); padding:16px 18px 30px; line-height:1.7; }
  footer a{ color:var(--fg); }
  /* Instagram: botón táctil al final de la carta */
  .social{ display:flex; justify-content:center; padding:10px 18px 24px; }
  .social a{ display:inline-flex; align-items:center; gap:10px; text-decoration:none;
    color:var(--fg); border:1px solid var(--line); border-radius:999px; padding:13px 22px;
    font-size:13.5px; letter-spacing:.02em; }
  .social a:active{ background:#221e1a; }
  .social svg{ width:19px; height:19px; display:block; flex:0 0 auto; }
  .social.top{ padding:4px 18px 16px; }   /* el de arriba va pegado a la nav */


</style>
</head>
<body>

<header>
  <h1>Kinomori</h1>
  <p>Tamraght · Morocco</p>
</header>

<nav>
  <a href="#dumplings">Dumplings</a>
  <a href="#rice">Rice</a>
  <a href="#noodles">Noodles &amp; Pho</a>
  <a href="#drinks">Drinks</a>
</nav>

<div class="social top">
  <a href="https://www.instagram.com/kinomori_s/" data-ig="kinomori_s"
     target="_blank" rel="noopener noreferrer"
     aria-label="Kinomori on Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5.2"/>
      <circle cx="12" cy="12" r="4.1"/>
      <circle cx="17.3" cy="6.7" r="1.15" fill="currentColor" stroke="none"/>
    </svg>
    <span>Follow us · @kinomori_s</span>
  </a>
</div>

<main>
  <figure id="dumplings">
    <img src="img/1-dumplings.jpg" alt="Kinomori menu — Handmade Dumpling, 6 pieces: Beef filling (65dh), Veggie filling (60dh) · Crispy / Sichuan Spicy / Soup" loading="eager" decoding="async">
  </figure>
  <figure id="rice">
    <img src="img/2-rice.jpg" alt="Kinomori menu — Rice: Nasi Goreng (65/75dh), Korean Bibimbap (70/80dh), Thai Green Curry (75/85dh), Hainan Chicken (80dh), Thai Kra Pao Beef Rice (75dh), KungPao Chicken (75dh)" loading="lazy" decoding="async">
  </figure>
  <figure id="noodles">
    <img src="img/3-noodles.jpg" alt="Kinomori menu — Noodle &amp; Pho: Mie Goreng (65/75dh), Sichuan Dandan Noodle (75dh), Beijing ZhaJiang Noodle (75dh), Thai Yum Sen Mee Gai (75dh), Vietnamese Pho Ga soup or dry (75dh), Peanut Sauce Chill Noodle (65dh)" loading="lazy" decoding="async">
  </figure>
  <figure id="drinks">
    <img src="img/4-drinks.jpg" alt="Kinomori menu — Drinks: Cold Brew Oolong Tea (20dh), Homemade VC Lemonnade (35dh), Tropical Iced Tea (30dh), Detox Green Juice (35dh), Fresh Orange Juice (25dh), Warm Pot Black Tea (25dh), Bottle of Water (10/20dh), Coca Cola (20dh), Sparkling Water (15dh)" loading="lazy" decoding="async">
  </figure>
</main>

<p class="hint">Tap an image and pinch to zoom · Prices in dirhams (MAD)</p>

<div class="social">
  <a href="https://www.instagram.com/kinomori_s/" data-ig="kinomori_s"
     target="_blank" rel="noopener noreferrer"
     aria-label="Kinomori on Instagram">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7"
         stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
      <rect x="3" y="3" width="18" height="18" rx="5.2"/>
      <circle cx="12" cy="12" r="4.1"/>
      <circle cx="17.3" cy="6.7" r="1.15" fill="currentColor" stroke="none"/>
    </svg>
    <span>Follow us · @kinomori_s</span>
  </a>
</div>

<footer>
  Kinomori · Tamraght, Morocco<br>
  <span id="updated"></span>
</footer>

<script>
  document.getElementById('updated').textContent = 'Menu updated ' + new Date().toLocaleDateString('en-GB', { day:'2-digit', month:'short', year:'numeric' });

  // Instagram: en el móvil, abrir la APP directamente en el perfil (ahí está el
  // botón Seguir a un toque). Si la app no está o no responde, se abre la web.
  // Ojo: no existe forma de forzar el "seguir" desde una web; Instagram no lo
  // permite, y lo que promete eso es phishing.
  var esMovil = /android|iphone|ipad|ipod/i.test(navigator.userAgent);
  document.querySelectorAll('a[data-ig]').forEach(function (a) {
    a.addEventListener('click', function (e) {
      if (!esMovil) return;
      e.preventDefault();
      var abierto = false;
      var marca = Date.now();
      document.addEventListener('visibilitychange', function () { if (document.hidden) abierto = true; });
      window.location.href = 'instagram://user?username=' + a.getAttribute('data-ig');
      setTimeout(function () {
        if (!abierto && !document.hidden && Date.now() - marca < 2000) {
          window.location.href = a.href;   // plan B: el perfil en el navegador
        }
      }, 1200);
    });
  });
</script>

</body>
</html>
